[experiment]
seed = 1234

[training]
dataset_path = /path/to/dataset/REDS
save_dir = /path/to/save/results
log_dir = log_dir

gpu = 0
nThreads = 8
batch_size = 12
lr = 0.0002
num_epochs = 400

finetuning = True
need_patch = True
save_train_img = True
patch_size = 256
scale = 4

stage = 2
num_seq = 3

lr_warping_loss_weight = 0.1
hr_warping_loss_weight = 0.1
flow_loss_weight = 0.0001
D_TA_loss_weight = 0.1
R_TA_loss_weight = 0.1
Net_D_weight = 0.1
memory_train_mode = sequential_epoch
memory_eval_mode = sequential
memory_debug = False

[network]
temporal_module = cdmr
memory_momentum = 0.9
motion_threshold = 1.0
confidence_threshold = 0.5
in_channels = 3
dim = 90
ds_kernel_size = 20
us_kernel_size = 5
num_RDB = 12
growth_rate = 18
num_dense_layer = 4
num_flow = 9
num_msa = 1
num_transformer_block = 2
num_heads = 6
LayerNorm_type = WithBias
ffn_expansion_factor = 2.66
bias = False

[validation]
val_period = 5

[test]
custom_path = /path/to/custom/dataset
